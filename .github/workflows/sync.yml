name: Sync and Release

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - self-host
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      rebased: ${{ steps.rebase.outputs.rebased }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1000
      - name: Rebase on awinterstein/habitica-android
        id: rebase
        run: |
          set -ex
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git fetch https://github.com/awinterstein/habitica-android.git self-host
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "rebased=false" >> "$GITHUB_OUTPUT"
          else
            git rebase FETCH_HEAD
            git push --force-with-lease origin HEAD:self-host
            echo "rebased=true" >> "$GITHUB_OUTPUT"
          fi

  Release:
    needs: Sync
    # Pushes made with GITHUB_TOKEN do not trigger workflows, so the rebase releases here
    if: ${{ !cancelled() && needs.Sync.result != 'failure' && (github.event_name == 'push' || needs.Sync.outputs.rebased == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: self-host
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Prepare
        run: |
          ./.github/prepare-workflow
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > signingrelease.properties <<EOF
          STORE_FILE=$RUNNER_TEMP/release.jks
          STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=habitica
          KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          EOF
      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :Habitica:assembleProdRelease "-Dorg.gradle.jvmargs=-Xmx4g"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^NAME=//p' version.properties)
          cp Habitica/build/outputs/apk/prod/release/*.apk "habitica-$VERSION.apk"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "habitica-$VERSION.apk" --title "Habitica $VERSION ($(git rev-parse --short HEAD))" --notes "Build of $(git rev-parse HEAD)" --target "$(git rev-parse HEAD)"
